name: Tufan Final Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Free Disk Space & Install Tools
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ant
          # تثبيت Aidl يدوياً لحل مشكلة المحاولة 46
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=${ANDROID_SDK_ROOT} "build-tools;33.0.0" "platform-tools" "platforms;android-33"
      - name: Build APK
        run: |
          pip install --user --upgrade "cython<3.0.0" buildozer
          export PATH=$PATH:$HOME/.local/bin
          # إنشاء المسارات لمنع FileNotFoundError
          mkdir -p .buildozer/android/platform/python-for-android
          buildozer android debug --auto-accept-sdk-licenses
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Tufan-APK
          path: bin/*.apk
