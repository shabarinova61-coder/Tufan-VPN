name: Build Tufan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout المشروع
        uses: actions/checkout@v4

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: تثبيت الأدوات الأساسية
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip git zip unzip wget

      - name: تثبيت Buildozer وCython
        run: |
          pip install --user "cython<3.0.0" buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: تنظيف ملفات البناء القديمة
        run: buildozer android clean

      - name: بناء APK
        run: buildozer -v android debug --auto-accept-sdk-licenses

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Tufan-APK
          path: bin/*.apk
