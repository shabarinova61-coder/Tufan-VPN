name: Build Tufan APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 تحميل المشروع
        uses: actions/checkout@v4

      - name: ⚡ كاش لتسريع البناء
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: 🧹 تثبيت الأدوات الأساسية
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip git zip unzip wget

      - name: ⚡ تثبيت Buildozer و Cython
        run: |
          pip install --user "cython<3.0.0" buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: 🧹 تنظيف ملفات البناء القديمة
        run: buildozer android clean

      - name: 🚀 تحميل SDK و NDK إذا لم تكن موجودة
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform
          # تحميل NDK r25c إذا لم يكن موجود
          if [ ! -d "android-ndk-r25c" ]; then
            wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip android-ndk-r25c-linux.zip
          fi
          # تحميل SDK إذا لم يكن موجود
          if [ ! -d "android-sdk" ]; then
            wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
            unzip cmdline-tools.zip -d android-sdk
          fi

      - name: 🚀 بناء التطبيق
        run: buildozer -v android debug --auto-accept-sdk-licenses

      - name: 📦 رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: Tufan-APK
          path: bin/*.apk
