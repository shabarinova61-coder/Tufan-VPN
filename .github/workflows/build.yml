name: Final Tufan VPN Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    # استخدام Ubuntu 22.04 لأنها أكثر استقراراً وأخف في استهلاك الذاكرة
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        # تنظيف السيرفر لتجنب خطأ Broken pipe الناتج عن امتلاء المساحة
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt update

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies
        # تثبيت المكتبات الصحيحة بما فيها libtinfo5 المتوافقة مع هذا الإصدار
        run: |
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer
          # إضافة مسار buildozer للـ PATH لضمان عمله
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Android APK
        run: |
          # 1. ربط مسارات الأندرويد الموجودة مسبقاً في السيرفر لتسريع البناء
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          
          # 2. حل مشكلة التوقف عند اتفاقية Google (الموافقة الرقمية القسرية)
          mkdir -p $ANDROID_HOME/licenses
          echo -e "8933bad161af9178dba494d1d2b164710192a090\nd56f5187479451e44173303381e441e6c468a993\n24333f8a63b6825ea9c5572767c0936e65691456" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license
          
          # 3. تشغيل البناء مع التجاوز التلقائي للأوامر
          buildozer android debug --auto-accept-sdk-licenses
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload Final APK
        # رفع الملف الناتج ليكون جاهزاً للتحميل
        uses: actions/upload-artifact@v4
        with:
          name: Tufan-VPN-Final-APK
          path: bin/*.apk
          retention-days: 7




