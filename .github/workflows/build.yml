name: Final Tufan VPN Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo apt update

      - name: Install System Dependencies
        run: |
          sudo apt install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev build-essential \
            ant # قمنا بإضافة أداة ANT هنا لمنع توقف البناء

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "cython<3.0.0" buildozer
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Build Android APK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          # الموافقة الرقمية على التراخيص
          mkdir -p $ANDROID_HOME/licenses
          echo -e "8933bad161af9178dba494d1d2b164710192a090\nd56f5187479451e44173303381e441e6c468a993" > $ANDROID_HOME/licenses/android-sdk-license
          # تشغيل البناء مع تجاوز التحميلات المعطلة
          buildozer android debug --auto-accept-sdk-licenses
        env:
          ACCEPT_SDK_LICENSE: "True"

      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Tufan-VPN-Final
          path: bin/*.apk
